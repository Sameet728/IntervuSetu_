<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI-powered voice interview platform — practice interviews with real-time AI feedback" />
    <meta name="application-name" content="IntervuSetu" />
    <meta name="apple-mobile-web-app-title" content="IntervuSetu" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#03050a" media="(prefers-color-scheme: dark)" />
    <title>IntervuSetu — Practice Like It's Real</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Resolve the stored theme before first paint to avoid a flash of the wrong surface -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme') || 'system'
          var dark = stored === 'dark' || (stored === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>

    <!-- Fonts: Inter for UI text, Instrument Sans for display, JetBrains Mono for numerals -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
